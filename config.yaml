# AgentForge 配置 —— 通用模板，跟着仓库走
# 修改后重启生效（Web UI 会在每次请求时重读）
#
# 这里是「换台电脑也能直接用」的默认值，所以刻意不写任何绝对路径。
# 本机专属的调整（工作区路径、模型窗口、步数上限…）请另存一份 config.lanrun.yaml
# 来改——那个文件不入库，只属于你这台机器。用法见 README「配置」一节。

ollama:
  host: http://localhost:11434
  # 模型在显存中保持存活的时间，避免每次调用重新加载 18GB 权重
  keep_alive: 15m
  request_timeout: 900
  # 检测到 Ollama 没起来时自动拉起（Windows 优先拉起桌面版「ollama app.exe」，
  # 没有就退回 `ollama serve`）。长期不关机的机器上，Ollama 可能被手动退出或
  # 升级时重启，本地模型会静默失效——开着这个就不用每次都自己去看。
  # 想完全自己掌控就设成 false，此时界面只提示「Ollama 无响应」，不做任何动作。
  auto_start: true
  # 拉起后最多等多少秒才判定失败（冷启动要加载模型索引，别给太短）。
  auto_start_wait: 45

models:
  # 2026 小模型综合第一（LCB 72.0 / MMLU-Pro 77.2 / GPQA 78.8，256K 上下文，
  # 原生工具调用，约 7.7GB，49 层全上 GPU 没问题）
  # 注意：think 必须为 true。设为 false 时 Ollama 会把推理过程混进正文，
  # 无法与最终答案分离（实测如此）。
  gemma:
    name: gemma4:12b
    # 32K → 128K → 256K：模型自身上限就是 262144（ollama show 可查）。
    # 实测 256K 仍是 100% GPU，显存 11.5GB(128K) → 13.8GB(256K)，16GB 卡够用；
    # 代价是多占约 2.3GB，若同时常驻别的模型或跑重度图形程序，可退回 196608。
    # 固定开销（系统提示 + 常用工具定义）约 3.0K tokens，占 256K 窗口约 1.2%。
    num_ctx: 262144
    # 1.0 → 0.5：高温下模型有概率走「只输出计划、不调工具」的分支，且会自我强化，
    # 表现为整轮空转（rerun26）。降温度让「动手」成为更稳的默认路径。
    temperature: 0.5
    top_p: 0.95
    think: true
    desc: 小模型综合第一（编码/推理/数学全能，原生工具调用）

  # 上一代 qwen3:4b 的全面升级版（LCB 55.8 vs 旧款约 35，262K 上下文，约 2.5GB）
  smart-mini:
    name: qwen3.5:4b
    # 16K → 64K。这张卡上 128K 会占到约 7.4GB（和 gemma 同时常驻容易吃紧），
    # 64K 是本机能长期稳住的档位，也够日常任务用。
    num_ctx: 65536
    temperature: 0.6
    top_p: 0.9
    think: true
    desc: 高效小模型（速度与能力兼顾，长上下文）

routing:
  default: gemma
  # 能力路由：按任务所需能力维度（编码/推理/写作/中文…）从可用模型里挑最强的；
  # 默认模型在该维度偏弱且存在更强可用模型时给出升级建议。
  # allow_upgrade=true 会直接改用更强的「本地」模型（默认只提示，不擅自切换）；
  # allow_paid_upgrade=true 才允许自动改用付费模型（默认绝不，避免偷偷花钱）。
  capability: true
  quality_threshold: 78
  # 按失败后果定档（swe-router 思路）：档位 → 模型综合分下限。
  # 选型 = 满足下限的最便宜模型（cost 维度），没人达标才用最强者兜底。
  # low 命中「草稿/试试/了解一下」等信号；high 命中「生产/上线/数据库/合同」等。
  stakes_tiers:
    low: 0
    medium: 78
    high: 86
  allow_upgrade: false
  allow_paid_upgrade: false
  # 命中这些信号时优先视为代码/逻辑任务（最终选哪个 key 由 router 按可用模型决定）
  code_signals:
    - 代码 - 编码 - 写个 - 写一段 - 函数 - 类 - 重构 - 重構成 - 实现 - 实现一下
    - bug - 报错 - 异常 - 报错信息 - traceback - stack - 调试 - debug - 修复 - 修一下
    - 测试 - unittest - pytest - 编译 - compile - 运行 - 脚本 - 正则 - SQL - 数据库
    - \.py - \.js - \.ts - \.java - \.go - \.rs - \.cpp - \.html - \.css - \.sql
    - 算法 - 数据结构 - 复杂度 - 排序 - 遍历 - 递归 - 动态规划
    - 数学 - 计算 - 推导 - 证明 - 方程 - 概率 - 矩阵 - 积分 - 逻辑题 - 数论
    - code - function - refactor - implement - fix - error - exception - test - script
  # 命中这些信号时明确走 general（优先级高于 code_signals）
  language_signals:
    - 翻译 - 润色 - 改写 - 文案 - 写作 - 总结 - 摘要 - 大纲 - 邮件 - 报告 - 周报
    - 解释一下 - 讲讲 - 什么意思 - 介绍一下 - 对话 - 聊天 - 起名 - 取个名字
    - translate - summarize - rewrite - draft - explain

workspace:
  # 智能体可访问的根目录，越出此目录的读写一律拒绝。
  # 不写就用本仓库所在目录——clone 到哪就在哪工作，换台电脑不用改这个文件。
  # 想让它管别的工作区（例如仓库的上级目录）时再打开下面这行：
  # root: D:\projects\my-workspace
  allow_outside: false
  # 运行期状态目录（长期记忆 memory.md、上传的附件）。
  # 不写 = <工作区>/.agentforge。留空即可，除非你想让它落在别处。
  # state_dir: D:\AI_develop\project\agent-forge\.agentforge

permissions:
  # 这些工具执行前需要人工确认（CLI 会弹确认，Web UI 会标红）
  require_approval:
    - write_file
    - edit_file
    - delete_file
    - run_command
    - ssh_run
    - ssh_upload
    - ollama_deploy
    - skill_install
    - tool_install
  # 命令黑名单前缀，命中直接拒绝
  command_blocklist:
    - format
    - del /s
    - del /f
    - rm -rf
    - rmdir /s
    - rd /s
    - remove-item -recurse
    - shutdown
    - taskkill /f /im system
    - diskpart
    - reg delete
    - bcdedit

agent:
  max_steps: 40          # 单次任务最大推理轮数，防止死循环
  max_tool_output_chars: 12000   # 单条工具输出截断长度
  keep_recent_tool_results: 6    # 只保留最近 N 条工具结果原文，更早的压缩为摘要
  stream: true
  # 多步任务的接力方式：
  #   brief 只把「总任务 + 各步摘要 + 产出文件」交给下一步（默认，省上下文）
  #   full  把前面每一步的完整对话与工具输出全部带上（更保险，但很快吃满窗口）
  relay: brief

  # 多 agent 调度：由一个本地决策模型把请求拆成【语义独立】的任务、指派执行 agent、
  # 维护共享进度（后面的 agent 拿交接简报接着干，不从头开始）。
  # 决策模型没安装/不可用时自动回退到规则拆解，不影响正常使用。
  dispatcher:
    enabled: true
    # 决策/调度模型：拆解任务、指派 agent、维护共享进度。可在「可用模型管理」页里
    # 从本地或在线模型中选择（留空=关闭，回退到规则拆解）。
    # 它本身也是一个普通模型，要和执行模型一起占显存，所以别选太大的：
    #   16GB 卡 → 4B 级（约 3.3GB）最稳；8GB 及以下建议直接用【在线模型】当调度器。
    #   在线调度模型不占显存、拆解通常更准，只产生一点调用费。
    #   也可给某个模型块加 keep_alive: "0"，让它每次用完立刻把显存还回去。
    model: qwen3.5:4b
    max_tasks: 6          # 单次最多拆几个任务
    parallel: true        # 互不相关的任务并行跑；本地模型仍受「本地串行」约束
    translate: true       # 执行模型中文弱时，调度器先把输入译成英文、结果再译回
    bridge_threshold: 55  # 中文维度低于这个分的执行模型才做桥接（桥接要多花两次调度调用，
                          # 调太高会让每个本地模型都白绕一圈；纯英文模型调到 70 左右）
    # 决策模型只负责「调度 + 简单对话」，不接重活：
    #   execute_simple=true  允许它自己做「不碰工具、不做计算」的几句闲聊/解释
    #   （工具调用、技能、代码、数学、写作、分析这类任务无论如何都不会派给它——
    #     免得真正有本事的模型闲着，活被小模型做砸）
    execute_simple: true
    synthesis: true       # 收尾由决策模型把各 agent 的结果汇总成一份答复

# 工具按需下发：35 个工具的完整 schema 约 4.1K tokens，且每轮都要重发一遍。
# 开启后每轮只下发「核心工具 + 按任务关键词命中的工具」，
# 其余只列名字进系统提示，模型需要时用 find_tools 现取用法。
tools:
  lazy: true
  limit: 16             # 单轮最多下发几个完整 schema
  min_score: 3.0        # 相关度阈值（IDF 加权）：3 左右能滤掉"文件/存在"这类大众词
  core: []              # 常驻工具名，留空用内置清单
                        # （list_dir/find_files/read_file/write_file/edit_file/
                        #   search_code/run_command/remember/find_tools/…）

# 上下文压缩：超过阈值自动瘦身，CLI 用 /compact、Web 点按钮可手动触发
compact:
  auto: true
  threshold: 60000       # 上下文字符数超过这个值触发压缩
  keep_chars: 20000      # 压缩后至少保留的近期内容
  summary_chars: 1500    # 摘要目标长度
  # 压缩分两级：先截断早期工具返回（快，不花钱），
  # 仍然超限才让模型把早期对话重写成摘要（慢，但压得狠）。

# 任务开局预热注入：开局扫一遍工作区，把「目录树 + README 摘要 + 任务关键词
# 命中文件清单」注进每个员工的系统提示，省掉开局摸黑的 1~3 轮探索调用。
# 注入位置在系统提示（免压缩区）——压缩只瘦身历史，永不碰这份项目速览。
# 体量很小：max_chars=3500 字 ≈ 1~2K token，占 256K 窗口 <1%、64K 约 3%。
warmup:
  enabled: true
  max_chars: 4200        # 注入块字符上限（超出截断）。加 external 仓库清单后
                         # 3500 会把「与任务相关的文件」整段切掉，得不偿失。
  max_files: 12          # 关键词命中文件清单的条目数

# Skill 系统（Agent Skills 开放标准，与 Claude Code / Codex / Cursor 通用）
skills:
  auto_load: true        # 任务命中 skill 描述时自动注入正文
  min_score: 2           # 自动注入所需的最低关键词命中数，调高可减少误触发
  auto_max_chars: 1600   # 自动注入时正文的截断长度（按小节切，不切半句）；
                         # 完整的正文模型会用 use_skill 自己取
  # 额外扫描的 skill 目录。默认已经会扫 <工作区>/skills 与 ~/.agentforge/skills，
  # 通常不需要写；只有技能放在别处时才打开：
  # dirs:
  #   - D:\my-skills

session:
  dir: .sessions

# 算力闸门（任务级）：同时「执行中」的任务上限。
# 本地显存一次只稳得住一个大模型就填 1；超出的任务在界面登记为「排队中」，
# 有空位自动开跑。填 2 表示跑着 A 的同时还能立刻开 B（显存够才行）。
compute:
  max_running: 1
